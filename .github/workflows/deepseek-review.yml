# An AI review of each pull request into dev by DeepSeek, through agent-config-kit's reusable
# workflow. It needs the DEEPSEEK_API_KEY secret (without it, it passes); README § CI/CD has the rest.
name: DeepSeek Code Review

on:
  pull_request:
    # dev only: a dev -> prod diff re-adds the AI config the strip removed.
    types: [opened, reopened, ready_for_review]
    branches: [dev]
  # `/ask-deepseek` on a pull request. GitHub runs it from the default branch's copy of this file.
  issue_comment:
    types: [created]

permissions:
  contents: read

# A newer request replaces a running review; any other comment gets a group of its own.
concurrency:
  group: deepseek-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ (github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/ask-deepseek')) && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    # A branch of this repository (a fork's run gets no secret), or /ask-deepseek from an owner,
    # member or collaborator. The job checks nothing out: it reads the diff over the API.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ask-deepseek') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read # read the pull request and its changed files over the API
      pull-requests: write # post or update the one review comment
    uses: adhibuchori/agent-config-kit/.github/workflows/deepseek-review.yml@8699a5bed2aa9d986c459f65b3e519c7bbe162d1 # v1.2.0
    with:
      # What this repository is and the rules no gate checks; lockfiles are always left out.
      instructions: |
        Nextra documentation site on Next.js
        (App Router, static export) and strict TypeScript. Most changes are
        MDX content under content/, not application code.

        What this repo is, so you do not invent findings for things it lacks:
        - No backend, API, database, auth or i18n. No src/ directory and no
          hooks/store/api layering.
        - No test runner at all — never ask for tests.
        - Styling comes from nextra-theme-docs; there is no Tailwind token system.
        - App code is a thin shell: app/ renders the content through Nextra's
          catch-all route, and components/ holds the few .tsx files the theme
          cannot express.

        Project rules that apply here:
        - Each directory's _meta.js controls nav order and titles; it must stay
          in sync with the .mdx files present.
        - content/changelog.mdx and generated docs come from scripts/generate/ —
          flag any hand-edit above the custom-section marker.
        - Diagrams reuse the component the site already has; flag a second
          diagram library.
        - The Nextra version pins in package.json and the Node flag in
          scripts/next/run.mjs encode known upstream bugs — do not suggest
          bumping or removing them casually.
        - Files <=150 lines, functions <=50 lines, nesting <=4 levels (oxlint.json
          warns on each), prefer early returns. Immutability: return a new
          copy, never mutate.
        - .env.* must never be edited by hand.

        Do NOT report anything the Quality Gate already enforces on this same
        PR: formatting, lint, type-check, dependency audit, secret scanning,
        build, source maps.
      exclude: 'content/changelog.mdx'
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
