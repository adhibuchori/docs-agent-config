name: DeepSeek Code Review

on:
  pull_request:
    # No `synchronize`: the action has no sticky comment, so every push would add
    # another review. Re-run on demand with `/ask-deepseek` instead.
    types: [opened, reopened]
    # dev only. A dev -> prod diff re-adds the whole AI config that
    # strip-ai-on-pr.yml removed, and GitHub answers 406 for a diff that size.
    branches: [dev]
  # On-demand: comment `/ask-deepseek` on a PR. GitHub runs this event from the
  # workflow file on the default branch, so edits reach comments once promoted.
  issue_comment:
    types: [created]

concurrency:
  # issue_comment has no pull_request object — fall back to the issue number.
  group: deepseek-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    # pull_request: a branch of this repository only; a fork's run gets no secret, so it is
    # skipped. issue_comment: `/ask-deepseek` on a PR from someone with write access.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/ask-deepseek') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # The action has no HTTP timeout, so a stalled DeepSeek API hangs the job until
    # this kills it. Successful runs take under a minute.
    timeout-minutes: 3
    permissions:
      contents: read # the action reads the pull request's diff over the API
      pull-requests: write # the action posts its review as a pull request comment

    steps:
      # No actions/checkout: the action reads the diff over the API and runs no code
      # from the pull request, which keeps the issue_comment path safe on a fork's PR.
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@eccde2e9781008d795e366b951e313e37af88dd5 # v1.21
        with:
          chat-token: ${{ secrets.DEEPSEEK_CODE_REVIEW_TOKEN }}
          # The action ignores bots, non-PR issues, and anyone outside
          # allowed-associations.
          watch-mention: '/ask-deepseek'
          allowed-associations: 'OWNER,MEMBER,COLLABORATOR'
          model: deepseek-v4-pro
          base-url: https://api.deepseek.com
          temperature: '0.3'
          exclude-patterns: 'pnpm-lock.yaml,package-lock.json,bun.lock,*.lock,content/changelog.mdx'
          # Describes the site: correct its stack, its app code and its rules to match yours,
          # or the reviewer reports findings against files you do not have.
          sys-prompt: |
            You are a code reviewer for a Nextra documentation site on Next.js
            (App Router, static export) and strict TypeScript. Most changes are
            MDX content under content/, not application code.

            Label every finding with a severity: CRITICAL (security or data-loss
            risk — blocks merge), HIGH (bug or significant quality issue), MEDIUM
            (maintainability concern), LOW (style or minor suggestion).

            What this repo is, so you do not invent findings for things it lacks:
            - No backend, API, database, auth or i18n. No src/ directory and no
              hooks/store/api layering.
            - No test runner at all — never ask for tests.
            - Styling comes from nextra-theme-docs; there is no Tailwind token system.
            - App code is a thin shell: app/ renders the content through Nextra's
              catch-all route, and components/ holds the few .tsx files the theme
              cannot express.

            Project rules that apply here:
            - Each directory's _meta.js controls nav order and titles; it must stay
              in sync with the .mdx files present.
            - content/changelog.mdx and generated docs come from scripts/generate/ —
              flag any hand-edit above the custom-section marker.
            - Diagrams reuse the component the site already has; flag a second
              diagram library.
            - The Nextra version pins in package.json and the Node flag in
              scripts/next/run.mjs encode known upstream bugs — do not suggest
              bumping or removing them casually.
            - Files <=150 lines, functions <=50 lines, nesting <=4 levels (oxlint.json
              warns on each), prefer early returns. Immutability: return a new
              copy, never mutate.
            - .env.* must never be edited by hand.

            Do NOT report anything the Quality Gate already enforces on this same
            PR: formatting, lint, type-check, dependency audit, secret scanning,
            build, source maps.

            Report an issue only when you can name the input or state that triggers
            it and what breaks as a result. Prefer a few well-evidenced findings
            over broad coverage. If the diff is sound, say so briefly. Answer in
            English, formatted as Markdown.
          user-prompt: |
            Review the following diff. Cite the file and line for every finding.
