name: CI/CD Pipeline

# Called by changelog.yaml, never triggered on push — a push trigger would build
# ahead of the [skip ci] content commit and ship a stale page. See README § CI/CD.
on:
  workflow_call:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # `output: 'export'` emits out/, then pagefind writes its index into it.
      - name: Build Static Site
        run: bun run build

      # Assets-only Worker: uploads out/ and nothing else. No container, no
      # image registry, no origin to keep alive.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler 4 needs Node 22+; the runner ships Node 20. Pin to 3
          # rather than add a setup-node step for one CLI invocation.
          wranglerVersion: '3'
